name: mid360-fastlio-test
x-common: &common
  image: rover-companion:jazzy
  network_mode: host
  # Fast DDS uses the PID in participant identity; distinct containers otherwise
  # start both ROS processes as PID 7 while sharing the same network interfaces.
  pid: host
  # Share DDS IPC with the physical driver when the RMW enables local transport.
  ipc: host
  restart: 'no'
  environment:
    ROS_DOMAIN_ID: '21'
    ROS_LOCALHOST_ONLY: '1'
    FASTDDS_BUILTIN_TRANSPORTS: UDPv4
    RMW_IMPLEMENTATION: rmw_fastrtps_cpp
    RMW_FASTRTPS_PUBLICATION_MODE: ASYNCHRONOUS
    OMP_NUM_THREADS: '2'
    OPENBLAS_NUM_THREADS: '1'
    TINI_SUBREAPER: '1'
  volumes:
    - .:/test:ro
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: '2'}
services:
  adapter:
    <<: *common
    container_name: rover-mid360-adapter
    command: [/test/ws/install/lib/mid360_lio_adapter/timing_adapter, --ros-args, -r, '/lio_test/points:=/mid360/points', -r, '/lio_test/livox:=/lio_pi/livox']
  fastlio:
    <<: *common
    container_name: rover-mid360-fastlio
    depends_on: [adapter]
    command: [/opt/rover/Rover/ros2/install/lib/fast_lio/fastlio_mapping, --ros-args, --params-file, /test/config.yaml, -r, '__node:=fastlio_mid360_pi_test', -r, '/Odometry:=/lio_pi/odometry', -r, '/cloud_registered:=/lio_pi/cloud_registered', -r, '/path:=/lio_pi/path', -r, '/map_save:=/lio_pi/map_save']
